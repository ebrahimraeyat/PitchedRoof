<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64px" height="64px" viewBox="0 0 64 64" version="1.1">
  <!-- Gable icon: roof outline with highlighted gable end (vertical face) -->

  <!-- Ground line -->
  <line x1="6" y1="52" x2="58" y2="52" stroke="#555753" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Roof slope (left) -->
  <line x1="6" y1="52" x2="32" y2="14" stroke="#2e3436" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Roof slope (right) -->
  <line x1="58" y1="52" x2="32" y2="14" stroke="#2e3436" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Gable end wall (right) - highlighted in blue to indicate the gable selection -->
  <line x1="58" y1="52" x2="58" y2="20" stroke="#3465a4" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Ridge continuation to gable top -->
  <line x1="32" y1="14" x2="58" y2="14" stroke="#2e3436" stroke-width="2" stroke-linecap="round" stroke-dasharray="4,3"/>

  <!-- Gable top line -->
  <line x1="58" y1="14" x2="58" y2="20" stroke="#3465a4" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Gable indicator dot -->
  <circle cx="58" cy="36" r="4" fill="#3465a4" stroke="#204a87" stroke-width="1.5"/>

  <!-- Roof ridge dot -->
  <circle cx="32" cy="14" r="4" fill="#2e3436" stroke="#000000" stroke-width="1.5"/>
</svg>
