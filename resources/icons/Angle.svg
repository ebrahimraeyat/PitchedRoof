<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64px" height="64px" viewBox="0 0 64 64" version="1.1">
  <!-- Angle icon: roof slope with an angle arc indicator -->

  <!-- Ground / base line -->
  <line x1="6" y1="52" x2="58" y2="52" stroke="#555753" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Roof slope -->
  <line x1="6" y1="52" x2="50" y2="16" stroke="#2e3436" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Vertical helper line for angle reference -->
  <line x1="6" y1="52" x2="6" y2="20" stroke="#555753" stroke-width="1.5" stroke-dasharray="4,3" stroke-linecap="round"/>

  <!-- Angle arc (orange) between slope line and ground -->
  <path d="M 24,52 A 18,18 0 0 0 14.5,35.5" fill="none" stroke="#f57900" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Angle label dot at arc end -->
  <circle cx="14.5" cy="35.5" r="3" fill="#f57900" stroke="#ce5c00" stroke-width="1.5"/>

  <!-- Angle marker cap dot at base of slope -->
  <circle cx="6" cy="52" r="3.5" fill="#2e3436" stroke="#000000" stroke-width="1.5"/>

  <!-- Arrow head on slope to indicate direction flip -->
  <polygon points="50,16 42,21 46,27" fill="#cc0000" stroke="#a40000" stroke-width="1"/>
</svg>
